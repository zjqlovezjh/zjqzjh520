<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Chat</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e24;
            --my-msg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --other-msg: #2b2b36;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: var(--text-main); }
        
        .chat-container { width: 100%; max-width: 480px; height: 100vh; background: var(--panel-bg); display: flex; flex-direction: column; position: relative; }
        
        /* 顶部导航 */
        .chat-header { padding: 16px 20px; background: rgba(30, 30, 36, 0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .chat-header .title { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4757; display: inline-block; margin-right: 8px; transition: 0.3s; }
        .status-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }

        /* 消息区域 */
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* 消息体 */
        .msg-wrapper { display: flex; align-items: flex-end; gap: 8px; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .msg-wrapper.self { flex-direction: row-reverse; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; flex-shrink: 0; }
        
        .msg-content { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
        .self .msg-content { align-items: flex-end; }
        
        .msg-info { font-size: 10px; color: var(--text-sub); display: flex; gap: 6px; padding: 0 4px; }
        
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .self .bubble { background: var(--my-msg); border-bottom-right-radius: 4px; color: #fff; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
        .other .bubble { background: var(--other-msg); border-bottom-left-radius: 4px; color: #e5e7eb; }

        /* 输入区域 */
        .chat-input-area { padding: 12px 16px 20px; background: var(--panel-bg); display: flex; gap: 12px; align-items: flex-end; }
        .input-box { flex: 1; background: #2b2b36; border-radius: 20px; padding: 10px 16px; display: flex; align-items: center; }
        .input-box input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; }
        .input-box input::placeholder { color: #6b7280; }
        
        .send-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--my-msg); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .send-btn:active { transform: scale(0.9); }
        .send-btn:disabled { opacity: 0.5; box-shadow: none; background: #4b5563; }

        /* 系统提示 */
        .system-msg { text-align: center; font-size: 12px; color: var(--text-sub); margin: 10px 0; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="title">Nexus Chat</div>
            <div style="display: flex; align-items: center; font-size: 12px; color: var(--text-sub);">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">连接中...</span>
            </div>
        </div>
        
        <div class="chat-messages" id="messages">
            <div class="system-msg">欢迎来到 Nexus 聊天室</div>
        </div>
        
        <div class="chat-input-area">
            <div class="input-box">
                <input type="text" id="input" placeholder="输入消息..." autocomplete="off">
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://lhnffwfpzejhyxkikqpn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6zYCefHASjx34j9WeNQySg_lLju-NQW';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // 生成随机名字和专属颜色
        const username = '用户' + Math.floor(Math.random() * 1000);
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#8e44ad', '#00cec9'];
        const myColor = colors[Math.floor(Math.random() * colors.length)];

        const channel = supabase.channel('nexus-chat-room', {
            config: { broadcast: { self: false } } 
        });

        channel.on('broadcast', { event: 'message' }, (payload) => {
            addMessage(payload.payload.user, payload.payload.text, payload.payload.time, payload.payload.color, false);
        });

        channel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                statusDot.classList.add('online');
                statusText.innerText = '已连接';
                sendBtn.disabled = false;
            } else {
                statusDot.classList.remove('online');
                statusText.innerText = '连接断开';
                sendBtn.disabled = true;
            }
        });

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            sendBtn.disabled = true;

            // 获取当前时间
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            await channel.send({
                type: 'broadcast',
                event: 'message',
                payload: { user: username, text: text, time: timeStr, color: myColor }
            });

            addMessage(username, text, timeStr, myColor, true);
            sendBtn.disabled = false;
            input.focus();
        }

        function addMessage(user, text, time, color, isSelf) {
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${isSelf ? 'self' : 'other'}`;
            
            // 头像：取名字最后一个字符
            const avatarChar = user.slice(-1);
            
            wrapper.innerHTML = `
                <div class="avatar" style="background-color: ${color};">${avatarChar}</div>
                <div class="msg-content">
                    <div class="msg-info">
                        <span>${user}</span>
                        <span>${time}</span>
                    </div>
                    <div class="bubble">${text}</div>
                </div>
            `;
            
            messagesDiv.appendChild(wrapper);
            
            // 平滑滚动到底部
            messagesDiv.scrollTo({
                top: messagesDiv.scrollHeight,
                behavior: 'smooth'
            });
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
