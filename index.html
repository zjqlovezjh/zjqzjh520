<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>零成本聊天室</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 16px; overflow: hidden; }
        .chat-container { width: 100%; max-width: 480px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; overflow: hidden; }
        .chat-header { padding: 16px; background: #075e54; color: #fff; text-align: center; font-weight: 600; font-size: 18px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
        .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.self { align-self: flex-end; background: #dcf8c6; }
        .message.other { align-self: flex-start; background: #fff; }
        .message .user { font-size: 11px; font-weight: 600; color: #075e54; margin-bottom: 2px; }
        .chat-input-area { display: flex; padding: 12px; background: #f0f0f0; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; outline: none; font-size: 14px; }
        .chat-input-area button { padding: 10px 20px; border: none; border-radius: 20px; background: #075e54; color: #fff; font-weight: 600; cursor: pointer; }
        .chat-input-area button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">💬 零成本聊天室</div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="input" placeholder="输入消息..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://lhnffwfpzejhyxkikqpn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6zYCefHASjx34j9WeNQySg_lLju-NQW';
        
        const ROOM = 'my-chat-room'; 

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        const username = '用户' + Math.floor(Math.random() * 10000);

        const channel = supabase.channel(ROOM, {
            config: { broadcast: { self: false } } 
        });

        channel.on('broadcast', { event: 'message' }, (payload) => {
            addMessage(payload.payload.user, payload.payload.text, false);
        });

        channel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                sendBtn.disabled = false;
                console.log('✅ 已连接到聊天室');
            }
        });
        sendBtn.disabled = true;

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            sendBtn.disabled = true;

            await channel.send({
                type: 'broadcast',
                event: 'message',
                payload: { user: username, text: text, timestamp: new Date().toISOString() }
            });

            addMessage(username, text, true);
            sendBtn.disabled = false;
            input.focus();
        }

        function addMessage(user, text, isSelf) {
            const div = document.createElement('div');
            div.className = 'message ' + (isSelf ? 'self' : 'other');
            div.innerHTML = `<div class="user">${user}</div>${text}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
